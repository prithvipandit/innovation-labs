<!DOCTYPE html>
<html>
<head>
    <title>Admin Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #FF6B6B, #FFD93D, #4D96FF);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h2 { color: #2D3436; text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #FF6B6B;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background: #FF5252; }
        #result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .success { background: #6BCB77; color: white; }
        .error { background: #FF6B6B; color: white; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Admin Login Test</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" value="admin" required>
            <input type="password" id="password" placeholder="Password" value="admin123" required>
            <button type="submit">Login</button>
        </form>
        <div id="result"></div>
        <div style="margin-top: 20px; font-size: 12px; color: #636E72; text-align: center;">
            Testing admin login API
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = 'Logging in...';
            resultDiv.className = '';
            
            try {
                const response = await fetch('https://playful-learning-64.preview.emergentagent.com/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `✓ Login Successful!<br><small>Token: ${data.token.substring(0, 20)}...</small>`;
                    resultDiv.className = 'success';
                    
                    // Store token
                    localStorage.setItem('admin_token', data.token);
                    localStorage.setItem('admin_username', data.username);
                    
                    // Redirect after 1 second
                    setTimeout(() => {
                        window.location.href = 'https://playful-learning-64.preview.emergentagent.com/admin/dashboard';
                    }, 1000);
                } else {
                    resultDiv.innerHTML = `✗ Login Failed: ${data.detail || 'Invalid credentials'}`;
                    resultDiv.className = 'error';
                }
            } catch (error) {
                resultDiv.innerHTML = `✗ Error: ${error.message}`;
                resultDiv.className = 'error';
                console.error('Login error:', error);
            }
        });
    </script>
</body>
</html>
